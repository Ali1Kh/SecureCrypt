<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureCrypt</title>
  <link rel="icon" type="" href="images/lock.png" />
  <link rel="stylesheet" href="CSS/components.css" />
  <link rel="stylesheet" href="CSS/global.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand lock  m-0" href="/"> <img src="images/lock.png" alt="Logo" />
        <p class="text-icone m-0"><samp>Secure</samp>Crypt</p>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse w-100" id="navbarNav">
        <ul class="navbar-nav d-flex justify-content-center">
          <li class="nav-item">
            <a class="nav-link " aria-current="page" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/SHA-1.html">SHA-1</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/RSA.html">RSA</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/CTR.html">CTR</a>
          </li>
        </ul>
      </div>
      <div class="w-100"></div>
    </div>
  </nav>
  <div class="dfCcc justify-content-start mb-4" style="min-height: 100vh; width: 100%; background-color: var(--bgClr)">
    <div id="content" class="w-100 dfCcc justify-content-start pt-4 px-3 px-md-4">
      <div class="dfCcc w-100">
        <h1 class="text dfcc fw-bolder" style="color: var(--mainClr); font-size: clamp(1.5rem, 5vw, 2.5rem);">
          RSA Algorithm
        </h1>
        <div class="dfcc w-100 w-lg-75 h-75 justify-content-around  align-items-start py-3 py-md-5">
          <div class="dfcc flex-column flex-lg-row gap-3 gap-lg-4 w-100 h-75 justify-content-center align-items-center">
            <!-- Input Section -->
            <div class="dfCcc ourShadow p-3 p-md-4 justify-content-center" style="
                  background-color: var(--bgClr3);
                  border-radius: 10px;
                  height: auto;
                  min-height: 650px;
                  width: 100%;
                  max-width: 550px;
                ">
              <h4 class="w-100 text dfcc fw-bolder justify-content-start"
                style="font-size: clamp(2.5rem, 3vw, 1.5rem);">
                Input
              </h4>
              <p class="w-100 py-3 py-md-1 text2 dfcc fw-bolder justify-content-start"
                style="font-size: clamp(0.8rem, 2.5vw, 1rem);">
                Enter plaintext in RSA
              </p>
              <h4 class="w-100 text dfcc justify-content-start py-2 py-md-3"
                style="font-size: clamp(1.5rem, 2.8vw, 1.2rem);">
                Plaintext
              </h4>
              <div class="input-field" style="width: 100%; height: 150px">
                <textarea id="plainText" placeholder="Enter text to encrypt"
                  style="font-size: clamp(0.8rem, 2.5vw, 1rem);"></textarea>
              </div>
              <h4 class="w-100 text dfcc justify-content-start py-2 py-md-3"
                style="font-size: clamp(1.5rem, 2.8vw, 1.2rem);">
                Encrypted Output
              </h4>
              <div class="input-field" style="width: 100%; height: 150px">
                <textarea id="encryptOutput" placeholder="Encrypt will appear here"
                  style="font-size: clamp(0.8rem, 2.5vw, 1rem);"></textarea>
                <div class="copy-button">
                  <img src="images/Copy.png" alt="copy" style="width: 30px; width: 40px; color: var(--mainClr)" />
                </div>
              </div>
              <div class="dfcc w-100 align-items-end" style="height: 80px; height: 100px;">
                <div class="button transition pointer dfcc ourShadow fw-bolder" onclick="encrypt()" style="
                      background-color: var(--bgClr4);
                      border-radius: 10px;
                      height: 45px;
                      height: 50px;
                      width: 100%;
                      font-size: clamp(0.8rem, 2.5vw, 1.125rem);
                      color: var(--mainClr);
                    ">
                  Encrypt
                </div>
              </div>
            </div>

            <!-- Output Section -->
            <div class="dfCcc ourShadow p-3 p-md-4 justify-content-center" style="
                  background-color: var(--bgClr3);
                  border-radius: 10px;
                  height: auto;
                  min-height: 650px;
                  width: 100%;
                  max-width: 550px;
                ">
              <h4 class="w-100 text dfcc fw-bolder justify-content-start"
                style="font-size: clamp(2.5rem, 3vw, 1.5rem);">
                Output
              </h4>
              <p class="w-100 py-2 py-md-1 text2 dfcc fw-bolder justify-content-start"
                style="font-size: clamp(0.8rem, 2.5vw, 1rem);">
                View and decrypt ciphertext using RSA
              </p>
              <h4 class="w-100 text dfcc justify-content-start py-2 py-md-3"
                style="font-size: clamp(1.5rem, 2.8vw, 1.2rem);">
                Ciphertext
              </h4>
              <div class="input-field" style="width: 100%; height: 150px">
                <textarea id="cipherText" placeholder="Enter Encrypted Text to Decrypt (Base64)"
                  style="font-size: clamp(0.8rem, 2.5vw, 1rem);"></textarea>
              </div>
              <h4 class="w-100 text dfcc justify-content-start py-2 py-md-3"
                style="font-size: clamp(1.5rem, 2.8vw, 1.2rem);">
                Decrypted Output
              </h4>
              <div class="input-field" style="width: 100%; height: 150px">
                <textarea id="decryptOutput" placeholder="Decrypted Output"
                  style="font-size: clamp(0.8rem, 2.5vw, 1rem);"></textarea>
              </div>
              <div class="dfcc w-100 align-items-end" style="height: 80px; height: 100px;">
                <div class="button transition pointer dfcc ourShadow fw-bolder" onclick="decrypt()" style="
                      background-color: var(--bgClr4);
                      border-radius: 10px;
                      height: 45px;
                      height: 50px;
                      width: 100%;
                      font-size: clamp(0.8rem, 2.5vw, 1.125rem);
                      color: var(--mainClr);
                    ">
                  Decrypt
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  
  <script src="JS/index.js"></script>
  <script src="JS/RSA.js"></script>
  <script>
    // Mobile menu toggle
    document.querySelector('.mobile-menu-btn').addEventListener('click', function () {
      document.querySelector('.nav-links').classList.toggle('active');
      this.classList.toggle('active');
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
  crossorigin="anonymous"></script>
  
</body>

</html>
