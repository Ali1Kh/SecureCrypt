<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureCrypt</title>
  <link rel="icon" type="" href="images/lock.png" />
  <link rel="stylesheet" href="CSS/global.css">
  <link rel="stylesheet" href="CSS/components.css">
  <link rel="stylesheet" href="CSS/SHA-1.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=content_copy" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand lock  m-0" href="/"> <img src="images/lock.png" alt="Logo" />
        <p class="text-icone m-0"><samp>Secure</samp>Crypt</p>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse w-100" id="navbarNav">
        <ul class="navbar-nav d-flex justify-content-center">
          <li class="nav-item">
            <a class="nav-link " aria-current="page" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/SHA-1.html">SHA-1</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/RSA.html">RSA</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/CTR.html">CTR</a>
          </li>
        </ul>
      </div>
      <div class="w-100"></div>
    </div>
  </nav>
  <div class="main-screen">
    <div class="main-text">
      <h1>SHA-1 Hash</h1>
    </div>

    <div class="coun">
      <div class="box">
        <div class="inbox">
          <div class="text-box">
            <h1>Generate Hash</h1>
            <p class="sc-text-inBox">Create SHA-1 hash from input text</p>
            <p class="bold-text-inBox">Input Text</p>

            <textarea class="hash-textarea" name="" id="sha1InputText" placeholder="Enter text to hash"></textarea>
            <p class="finaly-text-inBox">Generated SHA-1 Hash</p>

            <div class="textarea-wrapper">
              <textarea id="sha1OutputText" class="textarea-copyHash" placeholder="Hash will appear here"></textarea>
              <!-- <button class="copy-btn">Copy Hash</button> -->
              <span onclick="copyToClipboard('sha1OutputText')" class="material-symbols-outlined">content_copy</span>
            </div>

            <div class="d-flex justify-content-center w-100">

              <button class="Generate-btu" type="button" onclick="generateHash('sha1InputText')">
                Generate Hash
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="box">
        <div class="inbox">
          <div class="text-box">
            <h1>Verify Hash</h1>
            <p class="sc-text-inBox">
              Verify if a hash matches the input text
            </p>
            <p class="bold-text-inBox">Input Text</p>

            <textarea class="hash-textarea" id="sha1VerifyInput" placeholder="Enter text to verify"></textarea>

            <p class="finaly-text-inBox">SHA-1 Hash to Verify</p>

            <div class="textarea-wrapper">
              <textarea class="textarea-copyHash" id="sha1VerifyHash"
                placeholder="Enter hash to verify against"></textarea>
              <!-- <button class="copy-btn">Verify Hash</button> -->
            </div>

            <div class="d-flex justify-content-center w-100">
              <button class="Generate-btu" type="button" onclick="verifySha1()">Verify Hash</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="JS/index.js"></script>
  <script src="JS/SHA-1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>

</body>

</html>
