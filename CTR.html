<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="CSS/global.css">

  <link rel="stylesheet" href="CSS/components.css" />
  <link rel="stylesheet" href="CSS/CTR.css" />
  <link rel="icon" type="" href="images/lock.png" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=content_copy" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>SecureCrypt</title>
</head>

<body>
  <div class="nav-bar d-flex align-items-center">
    <div class="lock">
      <img src="images/lock.png" alt="Logo" />
      <p class="text-icone m-0"><samp>Secure</samp>Crypt</p>
    </div>

    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/SHA-1.html">SHA-1</a>
      <a href="/RSA.html">RSA</a>
      <a href="/CTR.html" class="active">CTR</a>
    </div>
  </div>

  <div class="main-screen">
    <div class="main-text">
      <h1>CTR Mode</h1>
    </div>

    <div class="coun">
      <div class="box">
        <div class="inbox">
          <div class="text-box">
            <h1>Input</h1>
            <p class="sc-text-inBox">
              Enter plaintext and generate encryption key
            </p>
            <p class="bold-text-inBox">Plaintext</p>

            <textarea class="hash-textarea" name="" id="" placeholder="Enter text to encrypt"></textarea>
            <p class="finaly-text-inBox">Secret Key</p>

            <div class="textarea-wrapper">
              <textarea class="textarea-copyHash" placeholder="Enter Secret Key"></textarea>
              <button class="GenerateKeys-btn">Generate Keys</button>
              <span class="material-symbols-outlined">content_copy</span>
            </div>
            <p class="finaly-text-inBox">Encrypted Output</p>
            <div class="textarea-container">
              <textarea class="textarea-appear" placeholder="here appear will key Generated"></textarea>
              <span class="material-symbols-outlined copy-icon-2">content_copy</span>
            </div>

            <button class="Encrypt-btu" type="button">Encrypt</button>
          </div>
        </div>
      </div>

      <div class="box">
        <div class="inbox">
          <div class="text-box">
            <h1>Output</h1>
            <p class="sc-text-inBox">
              View and decrypt ciphertext using CTR mode
            </p>
            <p class="bold-text-inBox">Ciphertext</p>

            <textarea class="hash-textarea" name="" id="" placeholder="Encrypted text will appear here"></textarea>

            <p class="finaly-text-inBox">Secret Key</p>

            <div class="textarea-wrapper">
              <textarea class="textarea-copyHash" placeholder="Enter Secret Key"></textarea>
            </div>

            <p class="finaly-text-inBox">Decryption Key</p>
            <textarea class="textarea-appear" placeholder="Decrypted Output" style="height: 225px"></textarea>

            <button class="Encrypt-btu" type="button" style="margin-top: 35px">
              Decrypt
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
