<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="CSS/global.css" />
  <link rel="stylesheet" href="CSS/components.css" />
  <link rel="stylesheet" href="CSS/CTR.css" />
  <link rel="icon" type="" href="images/lock.png" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=content_copy" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <title>SecureCrypt</title>
</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand lock  m-0" href="/"> <img src="images/lock.png" alt="Logo" />
        <p class="text-icone m-0"><samp>Secure</samp>Crypt</p>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse w-100" id="navbarNav">
        <ul class="navbar-nav d-flex justify-content-center">
          <li class="nav-item">
            <a class="nav-link " aria-current="page" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/SHA-1.html">SHA-1</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/RSA.html">RSA</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/CTR.html">CTR</a>
          </li>
        </ul>
      </div>
      <div class="w-100"></div>
    </div>
  </nav>
  <div class="main-screen">
    <div class="main-text">
      <h1>CTR Mode</h1>
    </div>

    <div class="coun">
      <div class="box">
        <div class="inbox">
          <div class="text-box">
            <h1>Input</h1>
            <p class="sc-text-inBox">
              Enter plaintext and generate encryption key
            </p>
            <p class="bold-text-inBox">Plaintext</p>

            <textarea class="hash-textarea" name="" id="plainTextInput" placeholder="Enter text to encrypt"></textarea>

            <div class="finaly-text-inBox secret-key-container">
              <label for="secretKey" class="secret-key-label">Secret Key:</label>
              <div class="secret-key-wrapper">
                <input id="secretKey" class="secretKey" placeholder="Secret Key" readonly />
                <span onclick="copyToClipboard('secretKey')"
                  class="material-symbols-outlined copy-icon-inside">content_copy</span>
              </div>
            </div>

            <p class="finaly-text-inBox">Encrypted Output</p>
            <div class="textarea-container">
              <textarea id="encryptOutput" readonly class="textarea-appear"
                placeholder="Encrypted text will appear here"></textarea>
              <span onclick="copyToClipboard('encryptOutput')"
                class="material-symbols-outlined copy-icon-inside-textarea">content_copy</span>
            </div>

            <button class="Encrypt-btu" type="button" onclick="encrypt('plainTextInput')">
              Encrypt
            </button>
          </div>
        </div>
      </div>

      <div class="box">
        <div class="inbox">
          <div class="text-box">
            <h1>Output</h1>
            <p class="sc-text-inBox">
              View and decrypt ciphertext using CTR mode
            </p>
            <p class="bold-text-inBox">Ciphertext</p>

            <textarea class="hash-textarea" name="" id="cipherTextInput" placeholder="Enter text to decrypt"></textarea>

            <div class="finaly-text-inBox secret-key-container">
              <label for="secretKeyInput" class="secret-key-label">Secret Key:</label>
              <div class="secret-key-wrapper">
                <input id="secretKeyInput" class="secretKey" placeholder="Enter Secret Key" />
                <span onclick="copyToClipboard('secretKeyInput')"
                  class="material-symbols-outlined copy-icon-inside">content_copy</span>
              </div>
            </div>

            <p class="finaly-text-inBox">Decryption Output</p>
            <textarea readonly id="decryptOutput" class="textarea-appear" placeholder="Decrypted Output"></textarea>

            <button onclick="decrypt('cipherTextInput')" class="Encrypt-btu" type="button">
              Decrypt
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="JS/CTR.js"></script>
  <script src="JS/index.js"></script>
</body>

</html>
